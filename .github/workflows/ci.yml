name: ci

on:
  push:
    branches: [main]
  pull_request:

# This workflow only builds and tests; it publishes nothing. Declaring the
# minimum here means the job does not inherit whatever the repository or
# organization default happens to be.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: build + test sidecar
        run: |
          # -o /dev/null: ./sidecar/ is a main package, so a bare `go build`
          # tries to write a binary named "sidecar" into the repo root, where
          # the sidecar/ directory already sits — which fails with
          # `build output "sidecar" already exists and is a directory`.
          go build -tags authsidecar_agentcore_identity -o /dev/null ./sidecar/
          go vet -tags authsidecar_agentcore_identity ./sidecar/...
          go test -tags authsidecar_agentcore_identity ./sidecar/...
      - name: build + test mcp-wrapper
        working-directory: mcp-wrapper
        run: |
          go build ./...
          go vet ./...
          go test ./...
